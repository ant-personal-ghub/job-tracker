<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf0f2">
<title>MFM Job Hunt Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Job Hunt">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@85..100,400..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3f0;
  --surface: #fdfcfb;
  --ink: #1a1a1a;
  --muted: #5a5550;
  --faint: #9a918a;
  --line: #e0d9d3;
  --red: #b3263a;       /* color Doppler: flow toward */
  --blue: #1f4f9c;      /* color Doppler: flow away */
  --teal: #1d6b5f;
  --amber: #a86b0c;     /* caliper marks */
  --amber-bg: #fbf1de;
  --purple: #6b3fa0;    /* breast sonography */
  --radius: 10px;
  font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
body { margin: 0; line-height: 1.45; font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 20px 120px; }

/* Header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.top h1 { font-size: 30px; line-height: 1.1; margin: 0; font-weight: 650; letter-spacing: -0.01em; font-stretch: 92%; }
.top .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sync { font-size: 13px; color: var(--faint); margin-right: 4px; }
.sync.err { color: var(--red); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 550; font-size: 14px; }
.btn:hover { border-color: #b9c6cc; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #2c3f4a; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.refresh .r-icon { display: none; }
.linkish { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 550; }

/* Last run */
.runline { font-size: 13px; color: var(--muted); margin: -8px 0 18px; }
.runline details { display: inline; }
.runline summary { display: inline; cursor: pointer; color: var(--red); }
.runline ul { margin: 6px 0 0; padding-left: 18px; color: var(--red); }

/* Pipeline: a caliper ruler across the stages */
.pipeline { position: relative; display: grid; grid-template-columns: repeat(5, minmax(84px, 1fr)) 18px repeat(2, minmax(84px, 1fr));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.stage { position: relative; border: 0; background: none; text-align: left; padding: 14px 14px 16px; }
.stage + .stage::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 1px; background: var(--line); }
.stage .n { display: block; font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--faint); letter-spacing: -0.01em; }
.stage .l { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; white-space: nowrap; }
.stage::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 2px 2px 0 0; background: transparent; }
.stage[aria-pressed="true"] .n { color: var(--ink); }
.stage[aria-pressed="true"] .l { color: var(--ink); font-weight: 600; }
.stage[aria-pressed="true"]::after { background: var(--blue); }
.stage[data-stage="new"][aria-pressed="true"]::after { background: var(--red); }
.stage.has .n { color: var(--ink); }
.gap { background: repeating-linear-gradient(to bottom, transparent 0 6px, var(--line) 6px 7px); width: 1px; justify-self: center; margin: 12px 0; }
.ruler { grid-column: 1 / -1; height: 7px; background:
  repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 12px) bottom / 100% 5px no-repeat; border-top: 1px solid var(--line); }

/* Filters */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.search { flex: 1 1 220px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 12px; min-width: 0; box-shadow: inset 0 1px 2px rgba(0,0,0,.04); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 5px 10px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: #2d2420; color: #fff; }
select.plain { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: 13px; }

/* Job list */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(0,0,0,.03); }
.job { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; padding: 14px 16px 14px 20px; border-top: 1px solid var(--line); }
.job:first-child { border-top: 0; }
.job::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 3px 3px 0; background: var(--line); }
.job[data-tier="top"]::before { background: var(--red); }
.job[data-tier="strong"]::before { background: var(--blue); }
.job[data-tier="breast"]::before { background: var(--purple); }
.job.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--amber-bg); } to { background: var(--surface); } }
.job-title { font-size: 16px; font-weight: 650; line-height: 1.3; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); }
.job-title:hover { color: var(--blue); }
.job.passed .job-title, .job.closed .job-title { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }
.job-sub { color: var(--muted); font-size: 14px; }
.job-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); margin-top: 4px; align-items: center; }
.where { font-weight: 600; color: var(--teal); }
.where.check { color: var(--amber); }
.salary { color: var(--teal); font-weight: 600; }
.fresh { color: var(--red); font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 12px; background: #ede9e4; color: #3d3530; border-radius: 10px; padding: 2px 9px; font-weight: 500; }
.due { color: var(--amber); font-weight: 600; }
.due.over { color: var(--red); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; font-size: 13px; color: var(--muted); margin: 6px 0 12px 0; }
.legend span { display: flex; flex-direction: row; align-items: center; gap: 6px; white-space: nowrap; }
@media (min-width: 640px) { .legend { grid-template-columns: repeat(4, auto); } }
.legend-dot { display: block; width: 8px; height: 8px; min-width: 8px; min-height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.legend .ltop .legend-dot { background: var(--red); }
.legend .lstrong .legend-dot { background: var(--blue); }
.legend .lbreast .legend-dot { background: var(--purple); }
.actions { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 550; white-space: nowrap; }
.act:hover { border-color: #b9c6cc; }
.act.pass:hover { color: var(--red); border-color: var(--red); }
.act.apply { border-color: var(--blue); color: var(--blue); }
.act.apply:hover { background: var(--blue); color: #fff; }
.act.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.detail { grid-column: 1 / -1; border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 12px; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.detail .snip { grid-column: 1 / -1; color: var(--muted); font-size: 14px; max-width: 72ch; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); }
.field textarea { min-height: 84px; resize: vertical; }
.field.full { grid-column: 1 / -1; }
.detail-foot { grid-column: 1 / -1; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--faint); }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* Settings */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
.panel h2 { font-size: 18px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
.panel > p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.area { border-top: 1px solid var(--line); padding: 14px 0 6px; }
.area:first-of-type { border-top: 0; padding-top: 4px; }
.area-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.area-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
.area.off .area-body { opacity: .45; pointer-events: none; }
.group-label { font-size: 13px; color: var(--muted); margin: 12px 0 6px; display: flex; gap: 10px; align-items: baseline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 5px 12px 5px 10px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--faint); }
.chip[aria-pressed="true"] { border-color: var(--teal); color: var(--teal); font-weight: 600; background: #e7f2ef; }
.chip[aria-pressed="true"]::before { background: var(--teal); border-color: var(--teal); }
.switch { position: relative; width: 42px; height: 24px; border-radius: 12px; border: 0; background: #c3ced3; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--teal); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .txt small { display: block; color: var(--muted); font-size: 13px; }
.street { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
.street input[type=range] { flex: 1 1 200px; accent-color: var(--teal); }
.street input[type=number] { width: 72px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: #fff; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 12px; align-items: center; z-index: 5; }
.savebar .btn { border-color: #52646e; background: transparent; color: #fff; }
.savebar .btn.primary { background: #fff; color: var(--ink); border-color: #fff; }

/* Setup */
.setup { max-width: 520px; margin: 8vh auto; }
.setup h1 { font-size: 30px; margin: 0 0 8px; font-weight: 650; font-stretch: 92%; }
.setup p { color: var(--muted); margin: 0 0 18px; }
.setup .field { margin-bottom: 12px; }
.setup .help { font-size: 13px; color: var(--muted); margin-top: 4px; }
.error { background: #fbe9eb; color: var(--red); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.demo-note { background: var(--amber-bg); color: #6b4507; border-radius: 8px; padding: 9px 12px; font-size: 14px; margin-bottom: 14px; }

/* Dialog + toast */
dialog { border: 0; border-radius: 12px; padding: 20px; width: min(520px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(27,42,51,.25); }
dialog::backdrop { background: rgba(27,42,51,.35); }
dialog h2 { margin: 0 0 12px; font-size: 20px; }
dialog form { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
dialog .field.full, dialog .dlg-actions { grid-column: 1 / -1; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 16px; font-size: 14px; display: flex; gap: 14px; align-items: center; z-index: 10; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
body:has(.savebar) .toast { bottom: 84px; }
.toast button { background: none; border: 0; color: #9cc3ff; font-weight: 600; padding: 0; }

@media (max-width: 680px) {
  .wrap { padding: 16px 12px 110px; }
  .top h1 { font-size: 26px; }
  .top-actions { width: 100%; }
  .top-actions .sync { order: 5; width: 100%; }
  .top-actions .btn { flex: 1 1 auto; }
  .top { position: relative; padding-right: 56px; }
  .btn.refresh { position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; flex: none; }
  .btn.refresh .r-word { display: none; }
  .btn.refresh .r-icon { display: inline; }
  .seg { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
  .seg button { white-space: nowrap; }
  .job { grid-template-columns: 1fr; padding-left: 18px; }
  .actions { justify-content: flex-start; }
  .detail { grid-template-columns: 1fr; }
  dialog form { grid-template-columns: 1fr; }
  .pipeline { grid-template-columns: repeat(5, 84px) 14px repeat(2, 104px); }
}
@media (prefers-reduced-motion: reduce) { .job.flash { animation: none; } .switch::after { transition: none; } }
</style>

<script>
"use strict";

/* ---------- constants ---------- */
const STAGES = [
  { key: "new", label: "New" },
  { key: "saved", label: "Saved" },
  { key: "applied", label: "Applied" },
  { key: "interviewing", label: "Interviewing" },
  { key: "offer", label: "Offer" },
  { key: "passed", label: "Not interested" },
  { key: "closed", label: "Closed" },
];
const STAGE_LABEL = Object.fromEntries(STAGES.map(s => [s.key, s.label]));
const EMPTY = {
  new: ["No new jobs right now", "Searches run at 6 AM and 5 PM. New matches land here."],
  saved: ["Nothing saved yet", "Save jobs you want to come back to."],
  applied: ["No applications yet", "Mark a job Applied and it moves here with today's date."],
  interviewing: ["No interviews yet", "Move a job here from Applied when you hear back."],
  offer: ["No offers yet", "This is where the good news goes."],
  passed: ["Nothing crossed off", "Jobs marked Not interested are kept here in case you change your mind."],
  closed: ["Nothing closed", "Use Closed for rejections or postings that were filled."],
  breast: ["No breast sonography jobs", "Breast sonographer postings appear here."],
};
const TIER_LABEL = { top: "MFM + Fetal Echo", strong: "MFM Or Fetal", possible: "OB Or Echo" };
const AREA_LABEL = { manhattan: "Manhattan", brooklyn: "Brooklyn", nj: "New Jersey" };

/* ---------- storage (falls back to memory where localStorage is blocked) ---------- */
const store = (() => {
  const mem = {};
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t");
    return { get: k => localStorage.getItem(k), set: (k, v) => localStorage.setItem(k, v), del: k => localStorage.removeItem(k) };
  } catch (e) { return { get: k => (k in mem ? mem[k] : null), set: (k, v) => { mem[k] = v; }, del: k => { delete mem[k]; } }; }
})();
const CONN_KEY = "mfmTracker.connection";

/* ---------- state ---------- */
const state = {
  screen: "loading", demo: false, conn: null, error: "",
  jobs: {}, hunter: {}, tracker: { items: {}, manual: {} },
  settings: null, defaults: EMBEDDED_DEFAULTS, shas: { tracker: null, settings: null },
  view: "jobs", stage: "new", q: "", area: "all", tier: "all", expanded: null,
  sync: "", syncErr: "", draft: null, loadedAt: 0, searchRunning: false, refreshing: false,
};

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowIso = () => new Date().toISOString();
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const clone = o => JSON.parse(JSON.stringify(o));
function daysAgo(iso) { if (!iso) return null; return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
function relDay(iso) {
  const d = daysAgo(iso); if (d === null) return "";
  return d <= 0 ? "today" : d === 1 ? "yesterday" : d < 30 ? `${d} days ago` : new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function shortDate(ymd) { if (!ymd) return ""; const [y, m, d] = ymd.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function timeOf(iso) {
  if (!iso) return ""; const d = new Date(iso); const day = relDay(iso);
  return `${d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })} ${day === "today" ? "today" : day}`;
}
const b64encode = s => { const b = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));

function mergedSettings(saved) {
  const base = clone((state.defaults && state.defaults.defaults) || {});
  const s = saved || {};
  for (const k of Object.keys(base)) {
    if (!(k in s)) continue;
    if (base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) base[k] = { ...base[k], ...s[k] };
    else base[k] = s[k];
  }
  return base;
}

/* ---------- GitHub ---------- */
class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function gh(path, opts = {}) {
  const { owner, repo, token } = state.conn;
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`, {
    ...opts, cache: "no-store",
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
  });
  if (!r.ok) {
    let msg = r.statusText; try { msg = (await r.json()).message || msg; } catch (e) {}
    throw new ApiError(r.status, msg);
  }
  return r;
}
async function readFile(path, raw = false) {
  const ref = encodeURIComponent(state.conn.branch);
  try {
    if (raw) {
      const r = await gh(`/contents/${path}?ref=${ref}`, { headers: { Accept: "application/vnd.github.raw+json" } });
      return { data: JSON.parse(await r.text()), sha: null };
    }
    const j = await (await gh(`/contents/${path}?ref=${ref}`)).json();
    return { data: JSON.parse(b64decode(j.content)), sha: j.sha };
  } catch (e) {
    if (e.status === 404) return { data: null, sha: null };
    throw e;
  }
}
async function writeFile(path, data, sha, message) {
  const body = { message, content: b64encode(JSON.stringify(data, null, 1) + "\n"), branch: state.conn.branch };
  if (sha) body.sha = sha;
  const j = await (await gh(`/contents/${path}`, { method: "PUT", body: JSON.stringify(body) })).json();
  return j.content.sha;
}
function explain(e) {
  if (e.status === 401) return "GitHub didn't accept the token. Check that it hasn't expired and was copied in full.";
  if (e.status === 404) return "Couldn't find that repository. Check the name, and that the token has access to it.";
  if (e.status === 403) return "The token doesn't have permission for this. It needs Contents: read and write (and Actions: read and write to start searches).";
  if (e instanceof TypeError) return "Couldn't reach GitHub. Check your internet connection.";
  return e.message || "Something went wrong talking to GitHub.";
}

/* ---------- loading ---------- */
async function loadAll() {
  const [jobs, tracker, settings, defaults] = await Promise.all([
    readFile("data/jobs.json", true), readFile("data/tracker.json"), readFile("data/settings.json"), readFile("data/settings_defaults.json", true),
  ]);
  state.jobs = (jobs.data && jobs.data.jobs) || {};
  state.hunter = (jobs.data && jobs.data.hunter) || {};
  if (defaults.data) state.defaults = defaults.data;
  const localTracker = state.tracker;
  state.tracker = mergeTracker(tracker.data || { items: {}, manual: {} }, localTracker);
  state.shas.tracker = tracker.sha;
  state.settings = mergedSettings(settings.data);
  state.shas.settings = settings.sha;
  state.loadedAt = Date.now();
}
async function refreshJobs() {
  const jobs = await readFile("data/jobs.json", true);
  state.jobs = (jobs.data && jobs.data.jobs) || {};
  state.hunter = (jobs.data && jobs.data.hunter) || {};
  state.loadedAt = Date.now();
}
function mergeTracker(remote, local) {
  const out = { items: { ...(remote.items || {}) }, manual: { ...(remote.manual || {}) } };
  for (const kind of ["items", "manual"]) {
    for (const [id, v] of Object.entries((local && local[kind]) || {})) {
      const r = out[kind][id];
      if (!r || (v.updated || "") > (r.updated || "")) out[kind][id] = v;
    }
  }
  return out;
}

/* ---------- saving ---------- */
let saveTimer = null, saving = false, saveAgain = false;
function queueSave() { state.sync = "pending"; renderSync(); clearTimeout(saveTimer); saveTimer = setTimeout(saveTracker, 1200); }
async function saveTracker() {
  if (state.demo) { state.sync = "saved"; renderSync(); return; }
  if (saving) { saveAgain = true; return; }
  saving = true; state.sync = "saving"; renderSync();
  try {
    try {
      state.shas.tracker = await writeFile("data/tracker.json", state.tracker, state.shas.tracker, "Update job tracker");
    } catch (e) {
      if (e.status !== 409 && e.status !== 422) throw e;
      const remote = await readFile("data/tracker.json");
      state.tracker = mergeTracker(remote.data || {}, state.tracker);
      state.shas.tracker = await writeFile("data/tracker.json", state.tracker, remote.sha, "Update job tracker");
    }
    state.sync = "saved"; state.syncErr = "";
  } catch (e) {
    state.sync = "error"; state.syncErr = explain(e);
  } finally {
    saving = false; renderSync();
    if (saveAgain) { saveAgain = false; saveTracker(); }
  }
}
async function saveSettings(silent = false) {
  const data = clone(state.draft || state.settings);
  if (state.demo) { state.settings = data; state.draft = null; if (!silent) toast("Settings saved (sample mode, nothing is stored)."); render(); return; }
  try {
    try { state.shas.settings = await writeFile("data/settings.json", data, state.shas.settings, "Update search settings"); }
    catch (e) {
      if (e.status !== 409 && e.status !== 422) throw e;
      const remote = await readFile("data/settings.json");
      state.shas.settings = await writeFile("data/settings.json", data, remote.sha, "Update search settings");
    }
    state.settings = data; state.draft = null;
    if (!silent) toast("Settings saved. They apply on the next search.", "Search now", startSearch);
    render();
  } catch (e) { toast(explain(e)); }
}

/* ---------- job model ---------- */
function allJobs() {
  const manual = Object.values(state.tracker.manual || {}).filter(m => !m.deleted);
  return [...Object.values(state.jobs), ...manual];
}
const itemOf = id => state.tracker.items[id] || {};
const statusOf = id => itemOf(id).status || "new";

function setStatus(id, status, { quiet = false } = {}) {
  const before = clone(state.tracker.items[id] || null);
  const it = state.tracker.items[id] = { ...(state.tracker.items[id] || {}) };
  it.status = status === "new" ? undefined : status;
  if (status === "applied" && !it.applied_on) it.applied_on = today();
  it.updated = nowIso();
  it.history = [...(it.history || []), [status, it.updated]];
  queueSave();
  const job = allJobs().find(j => j.id === id);
  if (!quiet && job) {
    toast(`${short(job.title)} moved to ${STAGE_LABEL[status]}.`, "Undo", () => {
      if (before) state.tracker.items[id] = { ...before, updated: nowIso() };
      else state.tracker.items[id] = { updated: nowIso() };
      queueSave(); render();
    });
  }
  render();
}
function setField(id, field, value) {
  const it = state.tracker.items[id] = { ...(state.tracker.items[id] || {}) };
  it[field] = value; it.updated = nowIso();
  queueSave();
}
const short = t => (t.length > 42 ? t.slice(0, 40) + "…" : t);

/* ---------- search now ---------- */
async function startSearch() {
  if (state.demo) { toast("Searches can be started once the tracker is connected to GitHub."); return; }
  if (state.searchRunning) return;
  try {
    await gh("/actions/workflows/job-hunter.yml/dispatches", { method: "POST", body: JSON.stringify({ ref: state.conn.branch, inputs: { mode: "normal" } }) });
  } catch (e) { toast(explain(e)); return; }
  state.searchRunning = true; render();
  toast("Search started. Results usually arrive in 2 to 3 minutes.");
  const started = Date.now();
  await new Promise(r => setTimeout(r, 20000));
  while (Date.now() - started < 8 * 60000) {
    try {
      const runs = await (await gh("/actions/workflows/job-hunter.yml/runs?per_page=1")).json();
      const run = runs.workflow_runs && runs.workflow_runs[0];
      if (run && run.status === "completed" && new Date(run.created_at).getTime() >= started - 60000) {
        await refreshJobs();
        state.searchRunning = false;
        const n = state.hunter.last_run_new || 0;
        if (run.conclusion !== "success") toast("The search ran into a problem. Check the Actions tab on GitHub.");
        else toast(n ? `Search finished: ${n} new job${n === 1 ? "" : "s"}.` : "Search finished: nothing new.", n ? "Show" : "", () => { state.view = "jobs"; state.stage = "new"; render(); });
        render(); return;
      }
    } catch (e) { /* keep polling */ }
    await new Promise(r => setTimeout(r, 15000));
  }
  state.searchRunning = false; render();
  toast("The search is taking a while. Refresh later to see results.");
}

async function doRefresh() {
  if (state.demo) { toast("Sample mode: nothing to refresh."); return; }
  state.refreshing = true; render();
  try {
    const [jobs, tracker] = await Promise.all([
      readFile("data/jobs.json", true),
      readFile("data/tracker.json"),
    ]);
    state.jobs = (jobs.data && jobs.data.jobs) || {};
    state.hunter = (jobs.data && jobs.data.hunter) || {};
    state.tracker = mergeTracker(tracker.data || { items: {}, manual: {} }, state.tracker);
    state.shas.tracker = tracker.sha;
    state.loadedAt = Date.now();
    toast("Up to date.");
  } catch (e) {
    toast(explain(e));
  }
  state.refreshing = false; render();
}

  <section class="panel">
    <h2>Your data</h2>
    <div class="row"><div class="txt">Download everything you've tracked<small>A spreadsheet of statuses, dates, and notes.</small></div><button class="btn small" data-act="csv">Download CSV</button></div>
    <div class="row"><div class="txt">${state.demo ? "Sample mode" : `Connected to ${esc(state.conn.owner)}/${esc(state.conn.repo)}`}<small>${state.demo ? "Connect a repository to save your work." : "The access token is stored only in this browser."}</small></div>
      <button class="btn small" data-act="disconnect">${state.demo ? "Connect" : "Disconnect"}</button></div>
  </section>`;
}
function renderSaveBar() {
  if (state.view !== "settings" || !state.draft || JSON.stringify(state.draft) === JSON.stringify(state.settings)) return "";
  return `<div class="savebar"><span>You have unsaved changes</span><button class="btn" data-act="discard">Discard</button><button class="btn primary" data-act="save-settings">Save settings</button></div>`;
}

/* ---------- setup ---------- */
function renderSetup() {
  const c = state.conn || JSON.parse(store.get(CONN_KEY) || "null") || {};
  return `
  <div class="wrap"><div class="setup">
    <h1>Connect your job tracker</h1>
    <p>The tracker keeps its data in the private GitHub repository that runs the job search, so it works on any phone or computer.</p>
    ${state.error ? `<div class="error">${esc(state.error)}</div>` : ""}
    <form id="setupForm">
      <div class="field"><label for="repo">Repository</label><input id="repo" name="repo" required placeholder="your-username/mfm-job-hunter" value="${esc(c.owner ? c.owner + "/" + c.repo : "")}" autocomplete="off" autocapitalize="off"></div>
      <div class="field"><label for="branch">Branch</label><input id="branch" name="branch" value="${esc(c.branch || "main")}" autocomplete="off" autocapitalize="off"></div>
      <div class="field"><label for="token">Access token</label><input id="token" name="token" type="password" required autocomplete="off" value="">
        <div class="help">A fine-grained GitHub token for this repository only, with Contents: read and write and Actions: read and write. It's stored only in this browser.</div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <button class="btn primary" type="submit">Connect</button>
        <button class="btn" type="button" data-act="demo">Preview with sample data</button>
      </div>
    </form>
  </div></div>`;
}

/* ---------- add job dialog ---------- */
function openAdd() {
  const dlg = document.getElementById("addDialog");
  dlg.innerHTML = `
    <h2>Add a job</h2>
    <form id="addForm" method="dialog">
      <div class="field full"><label for="a-title">Job title</label><input id="a-title" name="title" required></div>
      <div class="field"><label for="a-company">Employer</label><input id="a-company" name="company"></div>
      <div class="field"><label for="a-location">Location</label><input id="a-location" name="location"></div>
      <div class="field full"><label for="a-url">Link to posting</label><input id="a-url" name="url" type="url" placeholder="https://"></div>
      <div class="field"><label for="a-status">Status</label><select id="a-status" name="status">${STAGES.map(s => `<option value="${s.key}"${s.key === "saved" ? " selected" : ""}>${s.label}</option>`).join("")}</select></div>
      <div class="field full"><label for="a-notes">Notes</label><textarea id="a-notes" name="notes"></textarea></div>
      <div class="dlg-actions"><button class="btn" type="button" data-act="close-add">Cancel</button><button class="btn primary" type="submit">Add job</button></div>
    </form>`;
  dlg.showModal();
  dlg.querySelector("#a-title").focus();
}
function addManual(f) {
  const id = "m" + Math.random().toString(36).slice(2, 12), t = nowIso();
  state.tracker.manual[id] = { id, manual: true, title: f.title.trim(), company: f.company.trim(), location: f.location.trim(),
    url: f.url.trim(), area: "", zone: "", zone_ok: true, tier: "", tags: [], first_seen: t, updated: t };
  state.tracker.items[id] = { status: f.status === "new" ? undefined : f.status, notes: f.notes, updated: t,
    applied_on: f.status === "applied" ? today() : undefined, history: [[f.status, t]] };
  state.stage = f.status; state.expanded = id;
  queueSave(); render();
  toast("Job added.");
}

/* ---------- CSV ---------- */
function downloadCsv() {
  const rows = [["Status", "Title", "Employer", "Location", "Area", "Applied on", "Follow up by", "Contact", "Notes", "Link", "Found"]];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  for (const j of allJobs().sort((a, b) => STAGES.findIndex(s => s.key === statusOf(a.id)) - STAGES.findIndex(s => s.key === statusOf(b.id)))) {
    const it = itemOf(j.id);
    rows.push([STAGE_LABEL[statusOf(j.id)], j.title, j.company, j.location, j.zone || AREA_LABEL[j.area] || "", it.applied_on, it.follow_up, it.contact, it.notes, j.url, (j.first_seen || "").slice(0, 10)]);
  }
  const blob = new Blob([rows.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `job-tracker-${today()}.csv` });
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, actionLabel, action) {
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ""}`;
  el.hidden = false;
  if (actionLabel) el.querySelector("button").onclick = () => { el.hidden = true; action(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 6500);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case "stage": state.stage = t.dataset.stage; state.expanded = null; render(); break;
    case "area": state.area = t.dataset.v; render(); break;
    case "expand": state.expanded = state.expanded === id ? null : id; render(); break;
    case "status": setStatus(id, t.dataset.s); break;
    case "view":
      if (t.dataset.v === "jobs" && state.draft && JSON.stringify(state.draft) !== JSON.stringify(state.settings)
          && !confirm("Leave without saving your settings changes?")) return;
      if (t.dataset.v === "jobs") state.draft = null;
      state.view = t.dataset.v; window.scrollTo(0, 0); render(); break;
    case "search": startSearch(); break;
    case "refresh": doRefresh(); break;
    case "add": openAdd(); break;
    case "close-add": document.getElementById("addDialog").close(); break;
    case "delete-manual":
      if (confirm("Remove this job from your tracker?")) {
        state.tracker.manual[id] = { ...state.tracker.manual[id], deleted: true, updated: nowIso() };
        queueSave(); render();
      }
      break;
    case "toggle": {
      const d = draft(), [a, b] = t.dataset.key.split(".");
      if (b) d[a][b] = !d[a][b]; else d[a] = !d[a];
      render(); break;
    }
    case "place": { const d = draft(); d[t.dataset.kind][t.dataset.name] = !d[t.dataset.kind][t.dataset.name]; render(); break; }
    case "group": {
      const d = draft(), kind = t.dataset.kind, catKey = kind === "nj_towns" ? "nj" : "brooklyn";
      state.defaults.catalog[catKey].filter(x => x.group === t.dataset.group).forEach(x => { d[kind][x.name] = t.dataset.on === "1"; });
      render(); break;
    }
    case "discard": state.draft = null; render(); break;
    case "save-settings": saveSettings(); break;
    case "csv": downloadCsv(); break;
    case "disconnect":
      if (state.demo) { leaveDemo(); break; }
      if (confirm("Disconnect this browser? Your data stays in GitHub; you'll need the token to reconnect.")) {
        store.del(CONN_KEY); state.conn = null; state.screen = "setup"; state.error = ""; render();
      }
      break;
    case "demo": enterDemo(); break;
    case "leave-demo": leaveDemo(); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { state.q = t.value; document.getElementById("list").innerHTML = renderList(); return; }
  const f = t.dataset.field; if (!f) return;
  if (["notes", "contact"].includes(f)) setField(t.dataset.id, f, t.value);
  if (f === "street") {
    const v = Math.max(1, Math.min(220, parseInt(t.value, 10) || 1));
    draft().manhattan_max_street = v;
    document.querySelectorAll('[data-field="street"]').forEach(x => { if (x !== t) x.value = v; });
    const bar = document.querySelector(".savebar");
    if (!bar) { const tmp = document.createElement("div"); tmp.innerHTML = renderSaveBar(); if (tmp.firstChild) document.body.querySelector("#app").appendChild(tmp.firstChild); }
  }
});
document.addEventListener("change", e => {
  const t = e.target, f = t.dataset.field; if (!f) return;
  if (f === "status") setStatus(t.dataset.id, t.value);
  else if (f === "tier") { state.tier = t.value; render(); }
  else if (f === "applied_on" || f === "follow_up") { setField(t.dataset.id, f, t.value || undefined); render(); }
  else if (f === "age") { draft().max_posting_age_days = parseInt(t.value, 10); render(); }
  else if (f === "street") render();
});
document.addEventListener("submit", async e => {
  if (e.target.id === "addForm") {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target).entries());
    document.getElementById("addDialog").close();
    addManual(f);
  }
  if (e.target.id === "setupForm") {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target).entries());
    const [owner, repo] = f.repo.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$/, "").split("/");
    if (!owner || !repo) { state.error = "Enter the repository as username/repository-name."; render(); return; }
    state.conn = { owner, repo, branch: (f.branch || "main").trim(), token: f.token.trim() };
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Connecting…";
    try {
      await gh("");
      await loadAll();
      store.set(CONN_KEY, JSON.stringify(state.conn));
      state.error = ""; state.screen = "app"; state.demo = false;
      render(); rememberTrackerUrl(); openFromHash();
    } catch (err) {
      state.error = explain(err); state.screen = "setup"; render();
    }
  }
});
window.addEventListener("hashchange", openFromHash);
window.addEventListener("focus", async () => {
  if (state.screen !== "app" || state.demo || Date.now() - state.loadedAt < 60000) return;
  try { await refreshJobs(); render(); } catch (e) { /* ignore */ }
});

function openFromHash() {
  const m = location.hash.match(/job=([\w-]+)/); if (!m || state.screen !== "app") return;
  const job = allJobs().find(j => j.id === m[1]); if (!job) return;
  state.view = "jobs"; state.stage = statusOf(job.id); state.expanded = job.id; state.q = ""; state.area = "all"; state.tier = "all";
  render();
  const el = document.getElementById("job-" + job.id);
  if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); }
}
function rememberTrackerUrl() {
  if (!/^https?:/.test(location.protocol) || state.demo) return;
  const url = location.origin + location.pathname;
  if (state.settings.tracker_url !== url) { state.settings.tracker_url = url; state.draft = null; saveSettings(true); }
}

/* ---------- demo ---------- */
function enterDemo() {
  const d = n => new Date(Date.now() - n * 86400000).toISOString();
  const ymd = n => d(n).slice(0, 10);
  state.demo = true; state.screen = "app"; state.view = "jobs"; state.stage = "new";
  state.defaults = state.defaults || EMBEDDED_DEFAULTS;
  state.settings = mergedSettings({});
  state.hunter = { last_run: d(0.05), last_run_new: 3, last_run_errors: [] };
  const J = (id, o) => ({ id, source: "Sample", via: "", tags: [], zone_ok: true, first_seen: d(0), last_seen: d(0), ...o });
  state.jobs = Object.fromEntries([
    J("s1", { title: "Sonographer II, Maternal Fetal Medicine (Fetal Echo)", company: "Sample Women's Hospital", location: "New York, NY 10065", area: "manhattan", zone: "Manhattan, zip 10065", tier: "top", tags: ["Fetal echo", "MFM / Perinatal", "RDMS", "Full-time"], salary: "$58–$72/hr", posted: d(1), snippet: "Perform high-risk obstetric and fetal echocardiography exams in our MFM division. RDMS (OB/GYN) required; RDMS (FE) or RDCS (FE) preferred." }),
    J("s2", { title: "Fetal Echo Sonographer, Per Diem", company: "Sample Pediatric Cardiology", location: "Brooklyn, NY", area: "brooklyn", zone: "Brooklyn, Park Slope", tier: "top", tags: ["Fetal echo", "Peds / congenital echo", "RDCS", "Per diem"], posted: d(0), snippet: "Pediatric cardiology group seeks RDCS (FE) sonographer for fetal echocardiography referrals." }),
    J("s3", { title: "Perinatal Ultrasound Technologist", company: "Example Health System", location: "New York, NY", area: "manhattan", zone: "Posting only says New York, NY", zone_ok: false, tier: "strong", tags: ["MFM / Perinatal", "RDMS"], posted: d(2), first_seen: d(2) }),
    J("s4", { title: "OB/GYN Sonographer", company: "Demo Women's Imaging", location: "Hoboken, NJ", area: "nj", zone: "Hoboken, NJ", tier: "possible", tags: ["OB/GYN", "RDMS"], salary: "$95k–$115k/yr", posted: d(3), first_seen: d(3) }),
    J("s5", { title: "Ultrasound Technologist, Perinatal", company: "Sample Medical Center", location: "Jersey City, NJ", area: "nj", zone: "Jersey City, NJ", tier: "strong", tags: ["MFM / Perinatal", "Full-time"], salary: "$48/hr", posted: d(9), first_seen: d(9), last_seen: d(1) }),
    J("s6", { title: "Senior Ultrasound Technologist, MFM", company: "Example Faculty Practice", location: "New York, NY", area: "manhattan", zone: "Manhattan, Murray Hill", tier: "strong", tags: ["MFM / Perinatal", "RDMS"], posted: d(12), first_seen: d(12), last_seen: d(3) }),
    J("s7", { title: "Diagnostic Sonographer", company: "Sample Imaging Group", location: "New York, NY", area: "manhattan", zone: "Manhattan, Chelsea", tier: "possible", tags: ["OB/GYN"], posted: d(11), first_seen: d(11), last_seen: d(6) }),
    J("s8", { title: "Breast Sonographer", company: "Sample Women's Imaging", location: "New York, NY 10016", area: "manhattan", zone: "Manhattan, zip 10016", tier: "breast", tags: ["Breast sono", "RDMS", "Full-time"], salary: "$85k–$105k/yr", posted: d(2), first_seen: d(2) }),
  ].map(j => [j.id, j]));
  state.tracker = { manual: {}, items: {
    s5: { status: "applied", applied_on: ymd(6), follow_up: ymd(-2), notes: "Applied online. Recruiter is Dana, said they'd reach out within two weeks.", updated: d(6) },
    s6: { status: "saved", notes: "Ask about the fetal echo volume.", updated: d(2) },
    s7: { status: "passed", updated: d(4) },
  } };
  render();
}
function leaveDemo() { state.demo = false; state.jobs = {}; state.tracker = { items: {}, manual: {} }; state.screen = "setup"; state.error = ""; render(); }

/* ---------- start ---------- */
(async function init() {
  const saved = JSON.parse(store.get(CONN_KEY) || "null");
  if (!saved) { state.screen = "setup"; render(); return; }
  state.conn = saved; render();
  try { await loadAll(); state.screen = "app"; render(); rememberTrackerUrl(); openFromHash(); }
  catch (e) { state.error = explain(e); state.screen = "setup"; render(); }
})();
</script>
</body>
</html>
